<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDF Browser — Error</title>
    <style type="text/css">
        :root { color-scheme: light; }

        body {
            margin: 0;
            background: #fff;
            color: #1b1b1b;
            line-height: 1.55;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .wrap {
            max-width: 40rem;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 1rem;
            padding-bottom: .6rem;
            border-bottom: 1px solid #e6e6e6;
        }

        p { margin: 1rem 0; }

        .muted { color: #5c5c5c; }

        a { color: #2563eb; }

        #url {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .95em;
            word-break: break-all;
        }

        #message {
            background: #f6f6f6;
            border: 1px solid #ececec;
            border-radius: 6px;
            padding: .8rem;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .85rem;
        }

        #message:empty { display: none; }

        #identity { color: #5c5c5c; font-size: .9rem; }

        .actions {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        button {
            font: inherit;
            cursor: pointer;
            padding: .55rem 1.1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            color: #1b1b1b;
        }

        button:hover { background: #f4f4f4; }

        #login {
            background: #2563eb;
            color: #fff;
            border-color: transparent;
        }

        #login:hover { background: #1d4ed8; }

        .hint { color: #8a8a8a; font-size: .85rem; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>This resource couldn’t be displayed</h1>
    <p class="muted">RDF Browser could not render <a id="url"></a>.</p>
    <p id="message"></p>
    <p id="identity" hidden="hidden"></p>
    <div class="actions">
        <button id="login" hidden="hidden">Log in</button>
        <button id="refresh">Refresh</button>
        <button id="report">Report error</button>
    </div>
    <p id="sources" class="hint">Press Ctrl+U to view the page source.</p>
    <p id="status" class="hint"></p>
</div>
<script defer="defer" id="script" src="../controller/error.js">
    //script
</script>
</body>
</html>
