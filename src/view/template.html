<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title id="title"></title>
    <style>
        html {
            height: 100%;
            background-color: #F7F7F7;
        }

        body {
            margin: 0 auto;
            height: 100%;
            width: 100%;
        }

        main {
            width: calc(80% - 20px);
            height: calc(100% - 35px);
            overflow: auto;
        }

        main, aside {
            position: fixed;
            bottom: 0;
        }

        header {
            position: sticky;
            top: 0;
            margin-bottom: 3px;
            z-index: 1;
            background-color: #CCCCCC;
        }

        aside {
            height: calc(100% - 35px);
            right: 0;
            padding-left: 10px;
            width: calc(20% + 10px);
            background-color: #EEEEEE;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        header > div {
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 10px 0 rgba(0, 0, 0, 0.2);
            font-family: "Fira Sans", sans-serif;
            padding: 3px;
            display: flex;
        }

        .buffer {
            flex-grow: 1;
        }

        header > div > div:last-child {
            padding-right: 15px;
        }

        header div span.title {
            font-weight: bold;
            font-size: 24px;
        }

        header input {
            background-color: inherit;
            height: 20px;
            font-size: 14px;
        }

        header button {
            font-weight: bold;
        }

        header div img:first-child {
            display: block;
            float: left;
            padding: 0 5px;
            height: 25px;
            width: 25px;
        }

        header div span {
            padding: 5px;
            line-height: 25px;
            vertical-align: middle;
        }

        header #\#navButton {
            font-size: .85em;
        }

        header select {
            background-color: inherit;
        }

        aside div {
            font-family: "Fira Sans", sans-serif;
            margin-top: 20px;
            padding-right: 10px;
            font-size: .95em;
        }

        aside div:first-child {
            margin-top: 10px;
        }

        aside .it {
            font-style: italic;
        }

        aside h2 {
            margin: 5px 0 5px 0;
            font-size: larger;
        }

        aside table {
            margin: 5px 0 0 0;
        }

        aside table.horizontal th {
            padding: 0 5px;
            min-width: 40px;
        }

        aside th, aside td, aside .small {
            font-size: .9em;
            word-break: break-all;
        }

        td.tdCenter {
            text-align: center;
        }

        aside #\#uri {
            font-style: normal;
        }

        aside #\#ldp {
            margin: 5px 0 0 0;
            padding-left: 20px;
            list-style: none;
        }

        .ldpFulfilled::before {
            content: "✓ ";
            color: green;
            font-weight: bold;
        }

        .ldpNotFulfilled::before {
            content: "✗ ";
            color: red;
            font-weight: bold;
        }

        aside .resourceInfo {
            margin-bottom: 10px;
        }

        aside div.triples {
            overflow: inherit;
            margin: 0;
            font-size: .8em;
            padding-right: 0;
            min-height: 20%;
        }

        aside .triple {
            margin: 0 0 8px 0;
        }

        .prefixes {
            margin: 8px 8px 2em 8px;
        }

        .triples {
            margin: 0 8px;
        }

        .prefixes .prefixDeclaration, .prefixes .postfix {
            text-decoration: none;
        }

        .uri, .uri a, .prefixDeclaration {

        }

        .prefixName, .prefixName a {

        }

        .postfix, .postfix a, .literal a {

        }

        .blankNode {

        }

        .literal {

        }

        td {
            word-break: break-all;
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Fira+Sans" rel="stylesheet">
    <script id="script" src="../controller/style.js">
        //script
    </script>
    <script defer id="content-script" src="../main.js"></script>
</head>
<body id="template">
<main id="main">
    <div class="prefixes" id="prefixes">

    </div>
    <div class="triples" id="triples">

    </div>
</main>
<script id="hashnav">
    // The triples render inside a position:fixed, overflow:auto main element
    // that scrolls independently of the window, so the browser's native jump
    // to a #fragment into that container is unreliable. Scroll to the target
    // id explicitly on load and whenever the fragment changes (e.g. a click on
    // a self-reference). Keep this block free of the three characters HTML
    // escapes (angle brackets and ampersand): the template is round-tripped
    // through DOMParser/XMLSerializer, which would corrupt them inside script.
    (function () {
        function scrollToHash() {
            var hash = location.hash;
            if (!hash || hash === "#")
                return;
            var id;
            try {
                id = decodeURIComponent(hash.substring(1));
            } catch (e) {
                id = hash.substring(1);
            }
            var target = document.getElementById(id);
            if (target)
                target.scrollIntoView();
        }

        window.addEventListener("hashchange", scrollToHash);
        document.addEventListener("DOMContentLoaded", scrollToHash);
        // Re-run after the webfont stylesheet has loaded and reflowed layout,
        // which would otherwise leave the initial jump a few lines off.
        window.addEventListener("load", scrollToHash);
    })();
</script>
</body>
</html>
